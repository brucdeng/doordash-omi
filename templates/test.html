<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Voice Commands - OMI DoorDash</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                <i class="fas fa-microphone text-orange-500 mr-3"></i>
                Test Voice Commands
            </h1>
            <p class="text-gray-600">Test your OMI device voice commands for food ordering</p>
        </div>

        <!-- Test Interface -->
        <div class="max-w-4xl mx-auto">
            <!-- Voice Command Input -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">
                    <i class="fas fa-microphone text-orange-500 mr-2"></i>
                    Voice Command Simulator
                </h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Test Voice Command</label>
                        <textarea id="voiceInput" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500" rows="3" placeholder="Enter a voice command like: 'Order a pepperoni pizza from the closest highly rated place'"></textarea>
                    </div>
                    
                    <div class="flex space-x-3">
                        <button onclick="processVoiceCommand()" class="bg-orange-500 text-white py-2 px-6 rounded-lg hover:bg-orange-600 transition-colors">
                            <i class="fas fa-play mr-2"></i>
                            Process Command
                        </button>
                        <button onclick="clearResults()" class="bg-gray-500 text-white py-2 px-6 rounded-lg hover:bg-gray-600 transition-colors">
                            <i class="fas fa-trash mr-2"></i>
                            Clear
                        </button>
                    </div>
                </div>
            </div>

            <!-- Processing Status -->
            <div id="processingStatus" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                <div class="flex items-center">
                    <i class="fas fa-spinner fa-spin text-blue-500 mr-3"></i>
                    <span class="text-blue-800">Processing voice command...</span>
                </div>
            </div>

            <!-- Results -->
            <div id="results" class="space-y-6">
                <!-- Order Intent -->
                <div id="orderIntent" class="hidden bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">
                        <i class="fas fa-brain text-purple-500 mr-2"></i>
                        Extracted Order Intent
                    </h3>
                    <div id="intentContent" class="bg-gray-50 rounded-lg p-4">
                        <!-- Intent details will be populated here -->
                    </div>
                </div>

                <!-- Restaurant Search -->
                <div id="restaurantSearch" class="hidden bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">
                        <i class="fas fa-store text-green-500 mr-2"></i>
                        Restaurant Search Results
                    </h3>
                    <div id="restaurantContent" class="space-y-3">
                        <!-- Restaurant results will be populated here -->
                    </div>
                </div>

                <!-- Menu Items -->
                <div id="menuItems" class="hidden bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">
                        <i class="fas fa-utensils text-orange-500 mr-2"></i>
                        Menu Items
                    </h3>
                    <div id="menuContent" class="space-y-3">
                        <!-- Menu items will be populated here -->
                    </div>
                </div>

                <!-- Order Summary -->
                <div id="orderSummary" class="hidden bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">
                        <i class="fas fa-shopping-cart text-blue-500 mr-2"></i>
                        Order Summary
                    </h3>
                    <div id="summaryContent" class="bg-gray-50 rounded-lg p-4">
                        <!-- Order summary will be populated here -->
                    </div>
                    <div class="mt-4 flex space-x-3">
                        <button onclick="confirmOrder()" class="bg-green-500 text-white py-2 px-6 rounded-lg hover:bg-green-600 transition-colors">
                            <i class="fas fa-check mr-2"></i>
                            Confirm Order
                        </button>
                        <button onclick="modifyOrder()" class="bg-orange-500 text-white py-2 px-6 rounded-lg hover:bg-orange-600 transition-colors">
                            <i class="fas fa-edit mr-2"></i>
                            Modify Order
                        </button>
                    </div>
                </div>
            </div>

            <!-- Example Commands -->
            <div class="bg-white rounded-lg shadow-md p-6 mt-8">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">
                    <i class="fas fa-lightbulb text-yellow-500 mr-2"></i>
                    Example Voice Commands
                </h3>
                <div class="grid md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <h4 class="font-semibold text-gray-700">Basic Orders</h4>
                        <div class="space-y-1">
                            <button onclick="setVoiceInput('Order a pepperoni pizza from the closest highly rated place')" class="text-left text-sm text-blue-600 hover:text-blue-800 hover:underline">
                                "Order a pepperoni pizza from the closest highly rated place"
                            </button>
                            <button onclick="setVoiceInput('Get me a burger from the nearest restaurant')" class="text-left text-sm text-blue-600 hover:text-blue-800 hover:underline">
                                "Get me a burger from the nearest restaurant"
                            </button>
                            <button onclick="setVoiceInput('I want Chinese food delivered')" class="text-left text-sm text-blue-600 hover:text-blue-800 hover:underline">
                                "I want Chinese food delivered"
                            </button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <h4 class="font-semibold text-gray-700">Advanced Orders</h4>
                        <div class="space-y-1">
                            <button onclick="setVoiceInput('Order my usual from Tony\'s Pizza')" class="text-left text-sm text-blue-600 hover:text-blue-800 hover:underline">
                                "Order my usual from Tony's Pizza"
                            </button>
                            <button onclick="setVoiceInput('Get a gluten-free pizza from the closest place')" class="text-left text-sm text-blue-600 hover:text-blue-800 hover:underline">
                                "Get a gluten-free pizza from the closest place"
                            </button>
                            <button onclick="setVoiceInput('I\'m hungry, order something healthy nearby')" class="text-left text-sm text-blue-600 hover:text-blue-800 hover:underline">
                                "I'm hungry, order something healthy nearby"
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentOrder = null;

        function setVoiceInput(text) {
            document.getElementById('voiceInput').value = text;
        }

        function processVoiceCommand() {
            const voiceInput = document.getElementById('voiceInput').value.trim();
            if (!voiceInput) {
                alert('Please enter a voice command');
                return;
            }

            // Show processing status
            document.getElementById('processingStatus').classList.remove('hidden');
            
            // Simulate processing delay
            setTimeout(() => {
                simulateVoiceProcessing(voiceInput);
            }, 1500);
        }

        function simulateVoiceProcessing(voiceCommand) {
            // Hide processing status
            document.getElementById('processingStatus').classList.add('hidden');
            
            // Simulate extracted intent
            const intent = extractIntent(voiceCommand);
            showOrderIntent(intent);
            
            // Simulate restaurant search
            setTimeout(() => {
                const restaurants = getMockRestaurants();
                showRestaurantSearch(restaurants);
                
                // Simulate menu items
                setTimeout(() => {
                    const menuItems = getMockMenuItems();
                    showMenuItems(menuItems);
                    
                    // Simulate order summary
                    setTimeout(() => {
                        const orderSummary = createOrderSummary(intent, restaurants[0], menuItems.slice(0, 2));
                        showOrderSummary(orderSummary);
                    }, 1000);
                }, 1000);
            }, 1000);
        }

        function extractIntent(voiceCommand) {
            const command = voiceCommand.toLowerCase();
            
            return {
                food_item: extractFoodItem(command),
                location_preference: command.includes('closest') || command.includes('nearby') ? 'closest' : '',
                dietary_restrictions: extractDietaryRestrictions(command),
                quantity: extractQuantity(command),
                special_requests: ''
            };
        }

        function extractFoodItem(command) {
            if (command.includes('pepperoni pizza')) return 'pepperoni pizza';
            if (command.includes('burger')) return 'burger';
            if (command.includes('chinese')) return 'chinese food';
            if (command.includes('pizza')) return 'pizza';
            if (command.includes('salad')) return 'salad';
            return 'food';
        }

        function extractDietaryRestrictions(command) {
            const restrictions = [];
            if (command.includes('gluten-free') || command.includes('gluten free')) restrictions.push('gluten-free');
            if (command.includes('vegetarian')) restrictions.push('vegetarian');
            if (command.includes('vegan')) restrictions.push('vegan');
            return restrictions;
        }

        function extractQuantity(command) {
            if (command.includes('two') || command.includes('2')) return 2;
            if (command.includes('three') || command.includes('3')) return 3;
            return 1;
        }

        function showOrderIntent(intent) {
            document.getElementById('orderIntent').classList.remove('hidden');
            document.getElementById('intentContent').innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="font-semibold text-gray-700">Food Item:</div>
                        <div class="text-gray-600">${intent.food_item}</div>
                    </div>
                    <div>
                        <div class="font-semibold text-gray-700">Location:</div>
                        <div class="text-gray-600">${intent.location_preference || 'Any location'}</div>
                    </div>
                    <div>
                        <div class="font-semibold text-gray-700">Dietary Restrictions:</div>
                        <div class="text-gray-600">${intent.dietary_restrictions.join(', ') || 'None'}</div>
                    </div>
                    <div>
                        <div class="font-semibold text-gray-700">Quantity:</div>
                        <div class="text-gray-600">${intent.quantity}</div>
                    </div>
                </div>
            `;
        }

        function showRestaurantSearch(restaurants) {
            document.getElementById('restaurantSearch').classList.remove('hidden');
            document.getElementById('restaurantContent').innerHTML = restaurants.map(restaurant => `
                <div class="border border-gray-200 rounded-lg p-4 hover:bg-gray-50">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-semibold text-gray-800">${restaurant.name}</div>
                            <div class="text-sm text-gray-600">${restaurant.cuisine_type} • ${restaurant.rating} ⭐</div>
                            <div class="text-sm text-gray-500">${restaurant.delivery_time} • $${restaurant.delivery_fee} delivery fee</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm text-gray-600">${restaurant.address}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showMenuItems(menuItems) {
            document.getElementById('menuItems').classList.remove('hidden');
            document.getElementById('menuContent').innerHTML = menuItems.map(item => `
                <div class="border border-gray-200 rounded-lg p-4 hover:bg-gray-50">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-semibold text-gray-800">${item.name}</div>
                            <div class="text-sm text-gray-600">${item.description}</div>
                            <div class="text-sm text-gray-500">${item.dietary_info.join(', ')}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-semibold text-gray-800">$${item.price}</div>
                            <button class="text-orange-500 text-sm hover:text-orange-600">
                                Add to Order
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showOrderSummary(summary) {
            document.getElementById('orderSummary').classList.remove('hidden');
            document.getElementById('summaryContent').innerHTML = `
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="font-semibold">Restaurant:</span>
                        <span>${summary.restaurant.name}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-semibold">Items:</span>
                        <span>${summary.items.length} item(s)</span>
                    </div>
                    <div class="space-y-1">
                        ${summary.items.map(item => `
                            <div class="flex justify-between text-sm">
                                <span>${item.name} x${item.quantity}</span>
                                <span>$${(item.price * item.quantity).toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="border-t pt-2">
                        <div class="flex justify-between items-center font-semibold">
                            <span>Total:</span>
                            <span>$${summary.total.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `;
            currentOrder = summary;
        }

        function confirmOrder() {
            if (currentOrder) {
                alert(`Order confirmed! Total: $${currentOrder.total.toFixed(2)}`);
                clearResults();
            }
        }

        function modifyOrder() {
            alert('Order modification functionality coming soon!');
        }

        function clearResults() {
            document.getElementById('orderIntent').classList.add('hidden');
            document.getElementById('restaurantSearch').classList.add('hidden');
            document.getElementById('menuItems').classList.add('hidden');
            document.getElementById('orderSummary').classList.add('hidden');
            document.getElementById('voiceInput').value = '';
            currentOrder = null;
        }

        function getMockRestaurants() {
            return [
                {
                    id: "rest_1",
                    name: "Tony's Pizza Palace",
                    rating: 4.5,
                    delivery_time: "25-35 min",
                    delivery_fee: 2.99,
                    cuisine_type: "Italian",
                    address: "123 Main St, City, State"
                },
                {
                    id: "rest_2",
                    name: "Mario's Italian Kitchen",
                    rating: 4.2,
                    delivery_time: "20-30 min",
                    delivery_fee: 1.99,
                    cuisine_type: "Italian",
                    address: "456 Oak Ave, City, State"
                }
            ];
        }

        function getMockMenuItems() {
            return [
                {
                    id: "item_1",
                    name: "Pepperoni Pizza",
                    description: "Classic pepperoni pizza with mozzarella cheese",
                    price: 12.99,
                    dietary_info: ["contains-dairy", "contains-gluten"]
                },
                {
                    id: "item_2",
                    name: "Margherita Pizza",
                    description: "Fresh mozzarella, tomato sauce, and basil",
                    price: 11.99,
                    dietary_info: ["contains-dairy", "contains-gluten"]
                },
                {
                    id: "item_3",
                    name: "Caesar Salad",
                    description: "Fresh romaine lettuce with caesar dressing",
                    price: 8.99,
                    dietary_info: ["contains-dairy", "contains-gluten"]
                }
            ];
        }

        function createOrderSummary(intent, restaurant, items) {
            return {
                restaurant: restaurant,
                items: items.map(item => ({
                    ...item,
                    quantity: intent.quantity
                })),
                total: items.reduce((sum, item) => sum + (item.price * intent.quantity), 0)
            };
        }
    </script>
</body>
</html>
